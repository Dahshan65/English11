<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e3a8a">
<title>English 11 — الفصل الأول</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pr:#1e3a8a;--pr2:#3b82f6;--ok:#16a34a;--no:#dc2626;--wa:#f59e0b;--soft:#eff6ff;--uc:#2563eb}
body.dark{--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mu:#94a3b8;--bd:#24324a;--soft:#18243a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.7;min-height:100vh}
.en,.en *{direction:ltr;text-align:left;font-family:"Segoe UI",Roboto,Arial,sans-serif}
button{font-family:inherit;font-size:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--pr),var(--uc));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
header.top h1{font-size:17px;margin:0;flex:1;line-height:1.3}
header.top h1 small{display:block;font-size:12px;opacity:.85;font-weight:normal}
.hb{background:rgba(255,255,255,.18);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;display:flex;align-items:center;justify-content:center}
main{max-width:860px;margin:0 auto;padding:14px 12px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hero{background:linear-gradient(135deg,#1e3a8a,#3b82f6 60%,#06b6d4);color:#fff;border:0;display:flex;gap:14px;align-items:center}
.hero h2{margin:0 0 4px;font-size:20px}.hero p{margin:0;opacity:.9;font-size:14px}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.unit{border-radius:18px;padding:14px;color:#fff;border:0;text-align:right;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.unit .ic{font-size:30px}.unit .n{font-size:12px;opacity:.9}.unit .t{font-weight:bold;font-size:15px;direction:ltr;text-align:right}.unit .a{font-size:13px;opacity:.95}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#fff}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tool{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;color:var(--tx);text-align:center;font-size:14px}
.tool span{display:block;font-size:26px}
h3.sec{margin:18px 4px 10px;font-size:16px;color:var(--mu)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;position:sticky;top:58px;background:var(--bg);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:999px;font-size:14px}
.tab.on{background:var(--uc);color:#fff;border-color:var(--uc)}
.btn{border:0;background:var(--uc);color:#fff;padding:10px 16px;border-radius:12px;font-weight:bold;display:inline-flex;align-items:center;gap:6px}
.btn.o{background:transparent;color:var(--uc);border:1.5px solid var(--uc)}
.btn.g{background:var(--ok)}.btn.s{padding:6px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wsec{font-weight:bold;color:var(--uc);margin:6px 0 8px;font-size:15px}
.word{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px dashed var(--bd)}
.word:last-child{border-bottom:0}
.word .w{flex:1}.word .e{font-weight:bold;direction:ltr;text-align:right;font-family:"Segoe UI",Arial}
.word .ar{color:var(--mu);font-size:14.5px}.word .ex{direction:ltr;text-align:left;font-size:13.5px;color:var(--mu);background:var(--soft);padding:6px 9px;border-radius:9px;margin-top:5px;display:none;font-style:italic}
.word.open .ex{display:block}
.ib{border:0;background:var(--soft);color:var(--uc);width:34px;height:34px;border-radius:10px;flex:none;font-size:16px}
.ib.on{background:#fef3c7;color:#d97706}
table.gt{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;display:block;overflow-x:auto}
table.gt th,table.gt td{border:1px solid var(--bd);padding:7px 8px;vertical-align:top;min-width:92px;unicode-bidi:plaintext}
.expl,.q2 .small,li{unicode-bidi:plaintext}
table.gt i{display:block;direction:ltr;text-align:left;margin-top:3px}
table.gt th{background:var(--soft);color:var(--uc)}
table.gt td:first-child{font-weight:bold}
.tip{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:9px 12px;margin:10px 0;font-size:14.5px;color:#78350f}
body.dark .tip{background:#2a2410;border-color:#5b4a12;color:#fde68a}
h4{margin:14px 0 6px;color:var(--uc)}
ul,ol{padding-inline-start:22px;margin:6px 0}
.small{font-size:13px;color:var(--mu)}
.big{font-size:17px;font-weight:bold}
.ph{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
.ph:last-child{border-bottom:0}.ph .p{flex:1}.ph .pe{direction:ltr;text-align:left;font-weight:600}.ph .pa{font-size:13.5px;color:var(--mu)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mu);margin-bottom:8px}
.prog{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--uc);transition:width .3s}
.qtext{font-size:17px;font-weight:600;direction:ltr;text-align:left;margin-bottom:14px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;direction:ltr;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:9px;font-size:15.5px}
.opt b{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:var(--soft);color:var(--uc);margin-right:8px;font-size:13px}
.opt.ok{border-color:var(--ok);background:#f0fdf4;color:#14532d}.opt.no{border-color:var(--no);background:#fef2f2;color:#7f1d1d}
body.dark .opt.ok{background:#0f2a1a;color:#bbf7d0}body.dark .opt.no{background:#2a1010;color:#fecaca}
.expl{background:var(--soft);border-radius:12px;padding:10px 12px;margin:6px 0 12px;font-size:14.5px}
.score{text-align:center}.score .big2{font-size:46px;font-weight:bold;color:var(--uc)}
.flash{perspective:1000px;height:260px;margin:10px 0}
.fin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.f .fin{transform:rotateY(180deg)}
.fside{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;background:linear-gradient(135deg,var(--uc),#0ea5e9);color:#fff}
.fside.b{transform:rotateY(180deg);background:var(--card);color:var(--tx);border:2px solid var(--uc)}
.fside .fe{font-size:26px;font-weight:bold;direction:ltr}.fside .fa{font-size:21px;font-weight:bold}.fside .fx{direction:ltr;font-size:14px;color:var(--mu);margin-top:10px;font-style:italic}
input.search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
.reveal{display:none;margin-top:8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:9px 12px;direction:ltr;text-align:left}
body.dark .reveal{background:#0f2a1a;border-color:#14532d}
.reveal.show{display:block}
.q2{padding:10px 0;border-bottom:1px dashed var(--bd)}
footer.ft{text-align:center;padding:20px 10px 30px;color:var(--mu);font-size:14px}
.fbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;color:#fff;text-decoration:none;margin:4px;font-weight:bold;font-size:14px}
.badge{display:inline-block;background:var(--soft);color:var(--uc);border-radius:8px;padding:1px 8px;font-size:12px;margin-inline-start:6px}
.timer{font-weight:bold;color:var(--no)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.irr{display:grid;grid-template-columns:1fr 1fr 1fr;direction:ltr;text-align:left;font-size:14.5px}
.irr div{padding:6px 8px;border-bottom:1px solid var(--bd)}.irr .h{font-weight:bold;color:var(--uc);background:var(--soft)}
.ov li{margin-bottom:6px}
.pill{display:inline-block;background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:bold}
.bookbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:right;color:var(--tx);border:1.5px solid #93c5fd;background:linear-gradient(135deg,#eff6ff,#dbeafe)}
body.dark .bookbtn{background:linear-gradient(135deg,#172554,#1e3a8a);border-color:#1e40af}
.bookbtn span{font-size:38px}
</style>

<script>
const UNITS=[];
UNITS.push({
id:1, title:'Get the message', ar:'التواصل وإيصال الرسالة', icon:'💬', color:'#2563eb',
overview:[
'المفردات: تلازمات (contact / message / touch)، أفعال مركّبة (phrasal verbs)، تعابير التواصل، صفات المشاعر القوية.',
'القواعد: الأزمنة الحاضرة والماضية، وأسئلة التذييل (Question tags) وأسئلة الصدى (Echo questions).',
'القراءة: مقال Making contact عن جين غودال والتواصل مع الشمبانزي — مهارة تحديد رأي الكاتب.',
'الاستماع: مقابلة إذاعية عن الذكاء العاطفي (EQ).',
'المحادثة: التعبير عن المشاعر والرد عليها.',
'الكتابة: المقال التحليلي (Analytical essay).'
],
vocab:[
{s:'Lesson 1 — Collocations: contact / message / touch',w:[
['carry a message','يحمل رسالة','Pigeons were used to carry a message over long distances.'],
['convey a message','يُوصِل/ينقل رسالة (فكرة أو معنى)','The film conveys a message of hope.'],
['deliver a message','يُسلِّم رسالة','The postman delivered the message on time.'],
['pass on a message','يُبلِّغ/يُمرِّر رسالة لشخص آخر','Could you pass on a message to your brother?'],
['spread the message','ينشر الرسالة','Smoke signals spread the message that an enemy was coming.'],
['make contact with somebody','يتواصل مع شخص / يُجري اتصالاً','How can you make contact with someone on a desert island?'],
['establish contact','يُقيم/يؤسس اتصالاً','We established contact with the company last week.'],
['maintain contact','يحافظ على التواصل','It is hard to maintain contact with old friends.'],
['lose contact / touch with somebody','يفقد الاتصال بشخص','I lost touch with my school friends after we moved.'],
['stay in touch','يبقى على تواصل','Social media makes it easier to stay in touch.'],
['greeting (n)','تحيّة','The first text message ever sent was a greeting.'],
['at a distance','عن بُعد','People have always communicated at a distance.']]},
{s:'Lesson 2 — Phrasal verbs (Reading)',w:[
['bring about','يُحدِث / يتسبّب في (تغيير)','Jane Goodall brought about a change in how we see animals.'],
['figure out','يفهم / يحلّ / يكتشف','It took me ages to figure out how to use the telescope.'],
['get across','يُوصِل فكرة بنجاح','Some animals can get across complex ideas.'],
['make out','يرى/يميّز شيئاً بصعوبة','It was cloudy, but he could still make out the distant star.'],
['pick up','يلتقط (أصواتاً/إشارات)','Elephants can pick up sounds over large distances.'],
['point out','يلفت النظر إلى (خطأ أو معلومة)','He pointed out that I had made some spelling mistakes.'],
['spell out','يشرح بوضوح تام وبالتفصيل','Do I have to spell out what I mean?'],
['wipe out','يُبيد / يقضي على شيء تماماً','The groups tried to wipe out the rival group.'],
['take in','يستوعب ويتذكّر ما يُقال','Some animals can take in what we are saying.'],
['come across','يصادف / يجد بالصدفة','I came across an interesting article the other day.'],
['groom','ينظّف الفرو ويعتني به','Chimpanzees groom each other.'],
['omnivore (n)','كائن قارِت (يأكل النبات واللحم)','Chimpanzees are omnivores, not vegetarians.'],
['rival (n)','منافس / خصم','The team beat its old rival.'],
['scientific community','المجتمع العلمي','She showed the scientific community that animals use tools.']]},
{s:'Lesson 3 — Idioms & phrases about communication',w:[
['break the ice','يكسر الجليد (يبدأ الحديث مع الغرباء)','Talking about the weather is a good way to break the ice.'],
['strike up a conversation','يبدأ محادثة مع شخص','The best way to strike up a conversation is to comment on the weather.'],
['come across as','يبدو / يعطي انطباعاً بأنه','She comes across as very self-confident.'],
['pay somebody a compliment','يمدح / يُجامل شخصاً','Abeer paid her a compliment about her shoes.'],
['take to somebody','يُعجَب بشخص (من أول لقاء)','I took to him immediately.'],
['have a laugh','يضحك ويمرح','We really had a laugh about it.'],
['hit it off','ينسجم مع شخص فوراً','We hit it off right from the start.'],
['create a bond','يخلق رابطة/علاقة قوية','Laughing together can create a bond between you.'],
['make small talk','يتبادل حديثاً خفيفاً عابراً','Just make small talk about where you live.'],
['make a favourable impression','يترك انطباعاً جيداً','Don’t worry too much about making a favourable impression.'],
['make eye contact','ينظر في عيني الشخص','Make eye contact and smile.'],
['jump down somebody’s throat','يرد على شخص بغضب','I only asked a question – don’t jump down my throat!'],
['put somebody on the spot','يُحرج شخصاً بإجباره على جواب سؤال صعب','Sorry, I’m putting you on the spot.'],
['fire questions at somebody','يُمطر شخصاً بالأسئلة بسرعة','The reporters fired questions at the minister.'],
['refuse to let something drop','يرفض ترك الموضوع / يستمر بالحديث عنه','She refused to let the matter drop.'],
['insist on having the last word','يُصرّ على أن تكون له الكلمة الأخيرة','He always insists on having the last word.'],
['not get a word in edgeways','لا يستطيع قول كلمة لأن غيره يتكلم طوال الوقت','She talked so much I couldn’t get a word in edgeways.']]},
{s:'Lesson 5 — Emotion adjectives (strong synonyms)',w:[
['astonished (adj)','مذهول جداً (= very surprised)','I was astonished by the news.'],
['bewildered (adj)','حائر/مرتبك تماماً (= very confused)','He has no idea how he lost his phone. He feels completely bewildered.'],
['devastated (adj)','مُحطَّم / حزين جداً (= very sad)','She was devastated when she failed the exam.'],
['ecstatic (adj)','في غاية السعادة (= thrilled)','I’m ecstatic about my exam results!'],
['exasperated (adj)','ساخط / نافد الصبر (= very annoyed)','He is becoming more and more exasperated about the situation.'],
['livid (adj)','غاضب جداً / مستشيط غضباً (= furious)','Randa’s mother was livid when she found out about the cheating.'],
['tense (adj)','متوتّر (= nervous)','She felt very tense as she waited for her interview.'],
['terrified (adj)','مرعوب (= very frightened)','He’s terrified that someone will find out his secret.'],
['thrilled (adj)','مسرور جداً ومتحمّس','I was thrilled to hear from you.'],
['emotional intelligence (EQ)','الذكاء العاطفي','People with high EQ often earn more.'],
['self-aware (adj)','مُدرِك لذاته ولمشاعره','Writing a diary helps you become more self-aware.'],
['body language','لغة الجسد','Nodding is body language that shows you are listening.']]}
],
grammar:[
{t:'Present and past tenses',ar:'الأزمنة الحاضرة والماضية',html:`
<p>هذه أهم الأزمنة في الوحدة. ركّز على <b>الاستخدام</b> وعلى <b>الكلمات الدالّة</b> (time expressions).</p>
<table class="gt"><tr><th>الزمن</th><th>التكوين</th><th>الاستخدام</th><th>مثال</th></tr>
<tr><td>Present Simple</td><td>V / V+s</td><td>عادات وروتين، حقائق عامة، أفعال الحالة</td><td>It usually <b>takes</b> seconds to deliver a message.</td></tr>
<tr><td>Present Continuous</td><td>am/is/are + V-ing</td><td>يحدث الآن أو هذه الفترة، أوضاع تتغيّر</td><td>It’s <b>getting</b> easier to stay in touch.</td></tr>
<tr><td>Present Perfect Simple</td><td>have/has + V3</td><td>حدث في الماضي بلا وقت محدّد وله أثر الآن، حالة مستمرة حتى الآن، تجارب</td><td>The world <b>has become</b> a different place.</td></tr>
<tr><td>Present Perfect Continuous</td><td>have/has been + V-ing</td><td>نشاط مستمر أو متكرر من الماضي حتى الآن (التركيز على المدّة)</td><td>I’<b>ve been calling</b> Malek all day.</td></tr>
<tr><td>Past Simple</td><td>V2</td><td>حدث بدأ وانتهى في وقت محدد في الماضي</td><td>Papworth <b>sent</b> the first text in 1992.</td></tr>
<tr><td>Past Continuous</td><td>was/were + V-ing</td><td>حدث مستمر في لحظة ماضية، أو حدث طويل قاطعه حدث قصير</td><td>I <b>was watching</b> a film when the lights went out.</td></tr>
<tr><td>Past Perfect</td><td>had + V3</td><td>حدث ماضٍ وقع قبل حدث ماضٍ آخر</td><td>Paolina <b>had found</b> his bottle.</td></tr></table>
<h4>أفعال الحالة (State verbs)</h4>
<p>لا تأتي عادةً في الصيغة المستمرة: <i>love, like, believe, know, want, think (رأي), look (مظهر), see (يفهم)</i>.</p>
<ul><li>What do you <b>think</b> of my phone? (رأي ← بسيط) &nbsp;|&nbsp; What are you <b>thinking</b> about? (تفكير ← مستمر)</li>
<li>I <b>see</b> what you mean. (أفهم) &nbsp;|&nbsp; I’m <b>seeing</b> the doctor tomorrow. (موعد/لقاء)</li>
<li>He <b>looks</b> tired. (يبدو) &nbsp;|&nbsp; Why are you <b>looking</b> at me? (ينظر)</li>
<li>The flat <b>smells</b> of smoke. (حالة) &nbsp;|&nbsp; She’s <b>smelling</b> the milk. (فعل)</li></ul>
<h4>الكلمات الدالّة</h4>
<ul><li><b>Present Simple:</b> every so often, from time to time, once in a while, nowadays, these days</li>
<li><b>Present Continuous:</b> at the moment, right now, currently, these days</li>
<li><b>Present Perfect (Cont.):</b> for, since, ever since, recently, in recent years, so far, all day</li>
<li><b>Past Simple:</b> earlier today, the day before yesterday, in 1992, ago</li>
<li><b>Past Continuous:</b> at the time, while, when</li>
<li><b>Past Perfect:</b> before, after, by the time, already</li></ul>
<div class="tip">💡 Present Perfect Simple يركّز على <b>النتيجة/العدد</b> (I’ve called Malek <b>a couple of times</b>)، والمستمر يركّز على <b>المدّة</b> (I’ve been calling Malek <b>all day</b>).</div>`,
q:[
['I ______ Malek a couple of times today, but he hasn’t answered.',['have been calling','have called','was calling','call'],1,'"a couple of times" عدد مرات ← Present Perfect Simple.'],
['The phone ______ . Can you answer it?',['rings','is ringing','has rung','rang'],1,'يحدث الآن ← Present Continuous.'],
['It ______ easier and easier to stay in touch with people.',['gets','is getting','got','had got'],1,'وضع يتغيّر تدريجياً ← Present Continuous.'],
['I ______ a film when the lights suddenly went out.',['watched','had watched','was watching','have watched'],2,'حدث طويل قاطعه حدث قصير ← Past Continuous.'],

{t:'Question tags & echo questions',ar:'أسئلة التذييل وأسئلة الصدى',html:`
<p><b>Question tag</b> سؤال قصير يُضاف في <b>نهاية</b> الجملة لتأكيد معلومة أو إبقاء الحديث مستمراً. يتكوّن من <b>فعل مساعد/ناقص + ضمير</b>.</p>
<ul><li>جملة مثبتة ← تذييل منفي: It’s a great city, <b>isn’t it?</b></li>
<li>جملة منفية ← تذييل مثبت: You don’t understand, <b>do you?</b></li>
<li>زمن بسيط بلا فعل مساعد ← do/does/did: She usually comes late, <b>doesn’t she?</b> / They went to school, <b>didn’t they?</b></li>
<li>الأفعال الناقصة تتكرر: I can email my CV, <b>can’t I?</b> / I shouldn’t be so fussy, <b>should I?</b></li></ul>
<h4>حالات خاصة (مهمة جداً للامتحان)</h4>
<table class="gt"><tr><th>الحالة</th><th>التذييل</th><th>مثال</th></tr>
<tr><td>I am</td><td>aren’t I?</td><td>I’m still employed, <b>aren’t I?</b></td></tr>
<tr><td>Let’s</td><td>shall we?</td><td>Let’s go to the cinema, <b>shall we?</b></td></tr>
<tr><td>أمر مثبت</td><td>will you? / won’t you? / could you?</td><td>Write it down, <b>will you?</b> / Come and visit us, <b>won’t you?</b></td></tr>
<tr><td>أمر منفي (Don’t…)</td><td>will you?</td><td>Don’t be late, <b>will you?</b></td></tr>
<tr><td>Nobody / No one / Nothing (معنى منفي)</td><td>تذييل مثبت</td><td>Nobody came, <b>did they?</b> / Nothing ever changes, <b>does it?</b></td></tr>
<tr><td>Somebody / Everyone</td><td>they</td><td>Everyone was there, <b>weren’t they?</b></td></tr>
<tr><td>This / That</td><td>it</td><td>This is silly, <b>isn’t it?</b></td></tr>
<tr><td>These / Those</td><td>they</td><td>Those are Majeda’s guests, <b>aren’t they?</b></td></tr>
<tr><td>There is/are</td><td>there</td><td>There are lovely beaches, <b>aren’t there?</b></td></tr>
<tr><td>never, hardly, seldom</td><td>تذييل مثبت</td><td>He never calls, <b>does he?</b></td></tr></table>
<h4>التنغيم (Intonation)</h4>
<p>نغمة <b>هابطة ↘</b> عندما نتأكد من معلومة نعرفها، ونغمة <b>صاعدة ↗</b> عندما نسأل فعلاً.</p>
<h4>Echo questions أسئلة الصدى</h4>
<p>رد قصير يُظهر <b>الاهتمام أو الدهشة</b> ويُبقي الحديث مستمراً. يكون بنفس صيغة الجملة (مثبت ← مثبت):</p>
<ul><li>A: It’s my birthday tomorrow. — B: <b>Is it?</b> Do you have anything planned?</li>
<li>A: I used to live in Aqaba. — B: <b>Did you?</b> I bet it was amazing!</li>
<li>A: I can’t swim. — B: <b>Can’t you?</b></li></ul>`,

reading:{title:'Making contact (by Amer Asmar)',summary:`<p>يتحدّث المقال عن عالمة الطبيعة <b>جين غودال (Jane Goodall)</b> التي غيّرت فهمنا للتواصل عند الحيوانات.</p>
<ul><li>كانت تحبّ في طفولتها قصص <b>Dr Dolittle</b> الذي يكلّم الحيوانات، وربما ألهمها ذلك للسفر إلى أفريقيا في العشرينات من عمرها.</li>
<li>التقت بعالِم عرض عليها وظيفة مراقبة <b>الشمبانزي</b>، فذهبت مع أمّها إلى شاطئ بحيرة <b>تنجانيقا في تنزانيا</b> (منطقة Gombe Stream National Park).</li>
<li>لم يكن لديها تدريب علمي؛ في البداية هربت الحيوانات، لكن <b>هدوءها</b> كسب ثقتها على الأرجح.</li>
<li>اكتشفت أن الشمبانزي يتواصل باللمس والصوت وحتى <b>لغة الإشارة</b>، وأنه <b>يستخدم الأدوات</b> (عصيّ لالتقاط النمل) — وكان يُعتقد أن البشر وحدهم يستخدمون الأدوات.</li>
<li>بيّنت أنها حيوانات <b>قارتة (omnivores)</b> وليست نباتية، ورأت أن مجموعاتها تتقاتل لإبادة المجموعة المنافسة.</li>
<li>أصبحت عام <b>2002 رسولة الأمم المتحدة للسلام</b>.</li>
<li><b>رأي الكاتب:</b> جين غودال أحدثت تغييراً كاملاً في فهمنا لتواصل الحيوانات، ويعتقد أننا قد نتعلّم المزيد مستقبلاً.</li></ul>`,
skill:'Identifying the author’s opinion — تحديد رأي الكاتب',skillHtml:`<p>يعبّر الكاتب عن رأيه بطرق مختلفة:</p><ul><li>أفعال وعبارات الرأي: <i>I feel…, I think…, In my opinion…</i></li><li>الأفعال الناقصة: <i>We should…, It must be…</i></li><li>عبارات الاحتمال: <i>Maybe…, Possibly…, It is highly likely that…</i></li></ul><p>تذكّر أن تكوّن رأيك الخاص ولا تقبل رأي الكاتب دون تفكير ناقد.</p>`,

listening:{title:'A radio interview about emotional intelligence',html:`<p><b>الموضوع:</b> الفرق بين <b>IQ</b> (الذكاء العقلي — ثابت تقريباً) و<b>EQ</b> (الذكاء العاطفي — يمكن تطويره وتعلّمه).</p>
<ul><li>بحثٌ أظهر أن أصحاب الذكاء العاطفي المرتفع <b>يكسبون مالاً أكثر</b>.</li><li>الذكاء العاطفي ليس ثابتاً (not fixed) بخلاف IQ.</li><li>لتصبح أكثر وعياً بذاتك: اكتب <b>مذكّرات (diary)</b>.</li><li>علينا أن نتعرّف على مشاعرنا السلبية لنتمكّن من <b>التحكم بها</b>.</li><li>الآخرون لا يجعلوننا نشعر بشيء؛ نحن <b>مسؤولون</b> عن مزاجنا.</li><li>لغة الجسد مثل <b>الإيماء بالرأس (nodding)</b> وتواصل العين تُظهر أنك تستمع، والاستماع الفعّال يساعد على <b>تجنّب الخلافات</b>.</li></ul>
<div class="tip">🎧 مهارة الاستماع: اقرأ الأسئلة أولاً، توقّع نوع الكلمة الناقصة (اسم/فعل/رقم)، واكتب كلمات قليلة فقط.</div>`},

writing:{title:'An analytical essay — المقال التحليلي',html:`<p>المقال التحليلي يدرس موضوعاً بالتفصيل ويُثبت أفكار الكاتب باستخدام <b>حقائق موثّقة من مصادر</b> (وليس آراء).</p>
<h4>التنظيم</h4><ol><li><b>المقدمة:</b> عرّف الموضوع حتى يعرف القارئ ما ستناقشه.</li><li><b>العرض:</b> فقرة لكل فكرة، تبدأ بـ <b>جملة موضوع (topic sentence)</b> ثم الدليل والمصدر.</li><li><b>الخاتمة:</b> لخّص ما قلته.</li></ol>
<h4>المحتوى</h4><ul><li>يمكنك ذكر آراء الآخرين وتوضيح سبب عدم موافقتك.</li><li>اعرض <b>حقائق فقط</b>، واذكر المصادر داخل المقال وفي نهايته.</li></ul>
<h4>عبارات ذكر المصادر</h4><ul><li><b>According to</b> the website Net Positive, …</li><li>UNIDO <b>reports that</b> …</li><li>As Time magazine <b>argues</b> in its article …</li><li>Research <b>shows / indicates that</b> …</li></ul>
<h4>أفعال + حروف جر (من المقال)</h4><ul><li>refer <b>to</b> · direct <b>to</b> · rely <b>on</b> · look <b>into</b> · worried <b>about</b> · struggle <b>with</b> · have control <b>over</b></li></ul>`,
task:'Social media is a good thing because young people have more friends in more places than ever before. Do you agree?',
model:`<h4 class="en">Social Media and Friendship</h4><p class="en">Social media refers to websites and apps that allow people to share content and communicate online. Many people claim that it gives young people more friends than ever before. This essay will look at the evidence on both sides.</p><p class="en">It is true that social media connects young people across the world. According to the Pew Research Center, a majority of teenagers say they have made at least one new friend online. These friendships often begin through shared interests such as games, sport or study groups.</p><p class="en">However, having more online contacts does not always mean having closer friends. Research shows that heavy users of social media are more likely to report feelings of loneliness. In addition, many online "friends" are people the user has never met face-to-face.</p><p class="en">Finally, social media can strengthen existing friendships. Studies indicate that young people use messaging apps mainly to stay in touch with friends they already know, which helps them maintain contact when they move away.</p><p class="en">In conclusion, the evidence suggests that social media increases the number of people young people are connected to, but it does not automatically create deeper friendships. It is a useful tool when it is used to support real relationships.</p><p class="en small">Sources: Pew Research Center; studies on youth and social media.</p>`},

grammar:[
{t:'Future forms for predictions',ar:'صيغ المستقبل للتنبؤ',html:`
<table class="gt"><tr><th>الصيغة</th><th>التكوين</th><th>الاستخدام</th><th>مثال</th></tr>
<tr><td>will</td><td>will + V1</td><td>تنبؤ مبني على رأي/توقع (I think, probably…)، أو قرار لحظي</td><td>He’ll probably be late.</td></tr>
<tr><td>be going to</td><td>am/is/are going to + V1</td><td>تنبؤ مبني على دليل حالي، أو خطة/نيّة مسبقة</td><td>Look at the clouds! It’s going to rain.</td></tr>
<tr><td>Future Continuous</td><td>will be + V-ing</td><td>حدث مستمر في وقت محدد في المستقبل، أو حدث ضمن الروتين الطبيعي</td><td>This time tomorrow I’ll be flying to Aqaba.</td></tr>
<tr><td>Future Perfect Simple</td><td>will have + V3</td><td>حدث سيكتمل قبل وقت محدد في المستقبل</td><td>By 2050, half the languages will have disappeared.</td></tr>
<tr><td>Future Perfect Continuous</td><td>will have been + V-ing</td><td>مدة نشاط مستمر حتى نقطة في المستقبل</td><td>In July I will have been living here for three years.</td></tr></table>
<p><b>الكلمات الدالة:</b> Future Perfect / Continuous تأتي غالباً مع <b>by</b> (by 2050, by then, by the time, by next year) و <b>in</b> (in ten years) و <b>this time next week</b>.</p>
<div class="tip">💡 Zainab <b>will have graduated</b> from college <b>by next year</b>. ← by + وقت مستقبلي = Future Perfect (امتحان 2026).</div>
<h4>عبارات الاحتمال: be + adjective + to-infinitive</h4>
<ul><li><b>be bound / certain / sure to</b> ← شبه مؤكد: Driving is <b>sure to</b> become safer.</li>
<li><b>be likely to</b> ← محتمل: People are <b>likely to</b> live until 100.</li>
<li><b>be unlikely to</b> ← غير محتمل: Life is <b>unlikely to</b> get better.</li>
<li>It is likely/unlikely <b>that</b> + جملة: It is unlikely <b>that</b> we will produce enough meat.</li></ul>
<p>لا تُستخدم أفعال الحالة (be, believe, like, want…) في Future Continuous.</p>`,

['By 2050, young people ______ to get a job for most of their lives.',['will try','will have been trying','are trying','will be tried'],1,'مدة نشاط حتى نقطة مستقبلية ← Future Perfect Continuous.'],
['We’re sure we will find a cure. = We are ______ find a cure.',['bound to','unlikely to','about to','due to'],0,'sure = bound to.'],

['Oops! I’ve forgotten my wallet. I think I ______ go back home.',['am going to','will','will be','am due to'],1,'قرار لحظي ← will.'],

{t:'Future forms for plans and hopes',ar:'صيغ المستقبل للخطط والآمال',html:`
<table class="gt"><tr><th>الصيغة</th><th>الاستخدام</th><th>مثال</th></tr>
<tr><td>be going to + V1</td><td>قرار/نيّة اتُّخذت مسبقاً</td><td>I’m going to turn them into shorts.</td></tr>
<tr><td>will + V1</td><td>قرار لحظي، وعد</td><td>Send me the details… I’ll take a look.</td></tr>
<tr><td>Present Continuous</td><td>ترتيب مسبق مع شخص آخر</td><td>I’m meeting her next week.</td></tr>
<tr><td>Present Simple</td><td>جدول زمني ثابت</td><td>It starts at 7 p.m. in the auditorium.</td></tr>
<tr><td>will be + V-ing</td><td>حدث متوقع ضمن المجرى الطبيعي للأمور</td><td>She’ll be explaining how to read labels.</td></tr>
<tr><td>be planning / hoping to + V1</td><td>خطط وآمال</td><td>I’m hoping to sell them online.</td></tr>

<tr><td>be to + V1</td><td>ترتيبات رسمية، تعليمات وأوامر</td><td>The prince is to visit the new hospital.</td></tr></table>
<div class="tip">⚠️ انتبه: thinking <b>of + V-ing</b> (ليس to)، و hoping <b>to + V1</b> (ليس of).</div>`,

reading:{title:'They need saving too!',summary:`<p>يناقش المقال أن الحيوانات <b>الجميلة واللطيفة</b> (مثل الباندا رمز WWF) تحصل على الاهتمام والتمويل، بينما الحيوانات <b>الأقل جاذبية</b> أكثر عرضة للانقراض لأنها لا تنال اهتمام الباحثين.</p>
<ul><li><b>A — اللافقاريات:</b> تُشكّل أكثر من 90% من الكائنات لكنها تحصل على نسبة ضئيلة من أموال الحماية.</li>
<li><b>B — سمكة البلوب (blobfish):</b> عيون صغيرة وفم كبير وجسم وردي لزج، تعيش في أعماق المحيط حيث الضغط مرتفع جداً، لذا لها زعانف صغيرة ولا هيكل عظمي يحميها من السحق. تُصاد بالخطأ في شباك الصيد.</li>
<li><b>C — آكل النمل الحرشفي (pangolin):</b> أكثر حيوان يستهدفه الصيادون غير الشرعيين في العالم، الثديي الوحيد المغطى بالحراشف كالزواحف. حراشفه مطلوبة في الطب الصيني التقليدي، فانخفضت أعداده في الصين بنحو 90% منذ الستينات. الحراشف تحميه من المفترسين لكن الصياد يلتقطه بسهولة.</li>
<li><b>D — الآي آي (aye aye):</b> يوجد في مدغشقر فقط، أكبر الرئيسيات الليلية، انعزالي ذو فرو وغير مؤذٍ، لكنه يُقتل لأن الناس يرونه قبيحاً (ويُعتقد أنه نذير شؤم).</li>
<li>من الأردن: منذ 1978 تمت تربية أكثر من 100 من <b>المها العربي</b> في الأسر.</li></ul>`,
skill:'Reading for specific details — القراءة للتفاصيل',skillHtml:`<p>عند سؤال "In which paragraph…": حدّد الكلمات المفتاحية في السؤال، ثم ابحث عن <b>المرادفات</b> في النص وليس الكلمات نفسها (مثلاً: <i>least funding</i> ← <i>tiny percentage of the money</i>).</p>`,

listening:{title:'A lecture about climate change',html:`<p><b>الموضوع:</b> محاضرة ترد على حجج المشككين في التغيّر المناخي.</p><ul><li>نحو <b>97%</b> من العلماء يؤمنون بأن التغيّر المناخي حقيقي.</li><li>لفهم المناخ يجب النظر إلى <b>الاتجاه طويل الأمد (long-term trend)</b> وليس الطقس الحالي.</li><li>الطقس الأدفأ قد يسبب <b>تساقط ثلوج أكثر</b>.</li><li>في الماضي كانت التغيرات تدريجية وبعوامل طبيعية مثل <b>النشاط الشمسي والبراكين</b>.</li><li>ثاني أكسيد الكربون يساعد النباتات على النمو لكنه يسبب طقساً شاذاً يدمّر <b>المحاصيل</b>.</li></ul>
<h4>Active Listening: Signposting (إشارات المتحدث)</h4><table class="gt"><tr><th>العبارة</th><th>الوظيفة</th></tr><tr><td>I’m going to be talking about…</td><td>تقديم الموضوع</td></tr><tr><td>The second thing is… / Firstly…</td><td>ترتيب الحجج</td></tr><tr><td>In other words, …</td><td>إعادة الصياغة</td></tr><tr><td>… whereas …</td><td>المقارنة/مثال آخر</td></tr><tr><td>So, to sum up, …</td><td>الخاتمة</td></tr></table>`},

writing:{title:'A formal email — الإيميل الرسمي',html:`<h4>التحية والختام</h4><table class="gt"><tr><th>إذا</th><th>البداية</th><th>الختام</th></tr><tr><td>لا تعرف اسم الشخص</td><td>Dear Sir or Madam,</td><td>Yours faithfully,</td></tr><tr><td>تعرف الاسم</td><td>Dear Mr/Mrs/Ms Haddad,</td><td>Yours sincerely,</td></tr></table>
<h4>البنية</h4><ol><li><b>المقدمة:</b> سبب الكتابة — I am writing to draw your attention to… / I am writing to express my concern about…</li><li><b>الفقرات الرئيسية:</b> عرض المشكلة واقتراح الحلول.</li><li><b>الفقرة الأخيرة:</b> اطلب من المستلم اتخاذ إجراء — I urge you to… / I would ask you to…</li><li><b>قبل التوقيع:</b> أشر إلى انتظار الرد — I look forward to your response.</li></ol>
<h4>قواعد الأسلوب الرسمي</h4><ul><li>لا اختصارات: <b>I am writing</b> لا I’m writing.</li><li>تجنّب الأفعال المركبة: <b>reduce</b> بدل cut down on.</li><li>استخدم المبني للمجهول: <b>We are told that</b> / It is estimated that… بدل Some people say.</li><li>صيغ افتراضية مهذبة: <b>I would ask you to</b> بدل Please…</li></ul>
<h4>عبارات مفيدة</h4><ul><li>Making a point forcefully: <b>I am deeply concerned by…</b></li><li>Explaining importance: <b>It is essential/vital that we take immediate action.</b></li><li>Call to action: <b>I urge you to consider these solutions very seriously.</b></li><li>… as a matter of urgency · It should be banned · In the meantime, …</li></ul>`,
task:'Write a formal email to a coffee shop chain in your country. Describe the problem of disposable cups and urge the chain to take action.',
model:`<p class="en"><b>Subject:</b> Reducing disposable cups in your cafés</p><p class="en">Dear Sir or Madam,</p><p class="en">I am writing to draw your attention to the large number of disposable cups used in your coffee shops every day, and to suggest some practical solutions.</p><p class="en">As a regular customer, I am deeply concerned by the amount of waste your branches produce. It is estimated that billions of disposable cups are thrown away worldwide every year, and most of them cannot be recycled because of their plastic lining. It is essential that businesses take immediate action to reduce this waste.</p><p class="en">I would ask you to consider offering a discount to customers who bring their own reusable cups. In addition, you could sell affordable reusable cups with your logo, and replace plastic lids with biodegradable alternatives. Some international chains have already done this successfully, and it has improved their reputation with customers who care about the environment.</p><p class="en">I urge you to consider these suggestions seriously and to act as a matter of urgency to protect our environment.</p><p class="en">I look forward to your response.</p><p class="en">Yours faithfully,<br>Omar Khalil</p>`},

grammar:[
{t:'Past and present habits',ar:'العادات في الحاضر والماضي',html:`
<table class="gt"><tr><th>الصيغة</th><th>الاستخدام</th><th>مثال</th></tr>
<tr><td>Present/Past Continuous + always / constantly / forever</td><td>عادة متكررة أكثر من اللازم <b>مزعجة</b> أو غير متوقعة</td><td>She’s <b>always complaining</b>. / He was <b>forever arguing</b>.</td></tr>
<tr><td>will + V1 (حاضر)</td><td>سلوك نموذجي معتاد للشخص (لطيف أو مزعج)</td><td>He<b>’ll go</b> on and on about his grades.</td></tr>
<tr><td>would + V1 (ماضٍ)</td><td>أفعال متكررة في الماضي (ليست حالات)</td><td>We<b>’d spend</b> the afternoons reading.</td></tr>
<tr><td>used to + V1</td><td>عادة أو <b>حالة</b> في الماضي لم تعد موجودة</td><td>I <b>used to</b> live in Amman.</td></tr></table>
<h4>الفرق بين used to و would</h4><ul><li><b>would لا تُستخدم مع الحالات</b> (be, have, live, like, know): ✔ He <b>used to be</b> tiny. ✘ He would be tiny.</li><li>نبدأ الموضوع بـ <b>used to</b>، ثم نستخدم <b>would</b> بعد أن يتضح الزمن: <i>My dad used to work nights. He would come home at six and we’d have breakfast together.</i></li><li>النفي: didn’t use to · السؤال: Did you use to…?</li></ul>
<div class="tip">💡 I <b>used to get up</b> early when I was younger, but I nearly always have a lie-in now. (امتحان 2026)</div>`,
q:[
['I ______ early when I was younger, but I nearly always have a lie-in now.',['use to get up','would got up','will get up','used to get up'],3,'عادة ماضية انتهت ← used to + V1 (امتحان 2026).'],
['My brother ______ showing off. It’s so annoying!',['is always','always is','was used to','would'],0,'is always + V-ing ← عادة مزعجة.'],
['He ______ in Amman when he was young.',['would live','used to live','is always living','will live'],1,'live فعل حالة ← لا نستخدم would.'],
['She winds me up all the time. = She is ______ me up.',['always winding','used to wind','would wind','forever wound'],0,'always + V-ing.'],
['He talks behind my back and then denies it. = He ______ behind my back and then deny it.',['will talk','is talking','used talk','talking'],0,'will + V1 للسلوك المعتاد.'],
['When I was a child, we ______ in a house by the sea.',['would live','used to live','were always living','will live'],1,'حالة في الماضي.'],
['You let me down all the time. = You’re ______ me down.',['constantly letting','used to letting','would let','constantly let'],0,'constantly + V-ing.'],
['On Saturdays, I ______ go swimming with my dad. (past)',['would','will','am used to','was always'],0,'would لعادة متكررة ماضية.'],
['He ______ be the best player in the team, but now he prefers football.',['would','used to','is always','will'],1,'be حالة ← used to.'],
['I ______ like getting compliments. Now I do.',['didn’t use to','didn’t used to','wouldn’t','am not used to'],0,'النفي: didn’t use to.']]},
{t:'Relative & participle clauses',ar:'جمل الصلة وجمل اسم الفاعل/المفعول',html:`
<p>ضمائر الوصل: <b>who</b> (عاقل)، <b>whom</b> (عاقل مفعول به رسمي)، <b>which</b> (غير عاقل)، <b>that</b>، <b>whose</b> (ملكية)، <b>where</b> (مكان)، <b>when</b> (زمان).</p>
<table class="gt"><tr><th></th><th>Defining (محددة)</th><th>Non-defining (غير محددة)</th></tr>
<tr><td>الوظيفة</td><td>معلومة أساسية تحدد المقصود</td><td>معلومة إضافية يمكن حذفها</td></tr>
<tr><td>الفواصل</td><td>بدون فواصل</td><td><b>بين فاصلتين</b> دائماً</td></tr>
<tr><td>that</td><td>يمكن استخدامها بدل who/which</td><td><b>لا تُستخدم أبداً</b></td></tr>
<tr><td>حذف الضمير</td><td>يُحذف إذا كان مفعولاً به</td><td>لا يُحذف</td></tr>
<tr><td>مثال</td><td>The house (that) we walked past belongs to my grandfather.</td><td>My grandfather’s house, <b>which I love</b>, isn’t modern.</td></tr></table>
<ul><li><b>which للتعليق على الجملة كلها:</b> Oliver is adopted by Mr Brownlow, <b>which</b> shows what a kind man he is.</li>
<li>The vacation <b>which</b> we planned for months was enjoyable. (امتحان 2026)</li></ul>
<h4>حروف الجر في جمل الصلة</h4><p>في الكلام العادي تأتي في النهاية، وفي الأسلوب الرسمي في البداية مع <b>which / whom</b> فقط:</p><ul><li>the house (which) they lived <b>in</b> = the house <b>in which</b> they lived</li><li>the couple (who) he designed the house <b>for</b> = the couple <b>for whom</b> he designed the house</li></ul>
<h4>Participle clauses (اختصار جملة الصلة)</h4><ul><li><b>Present participle (V-ing)</b> يحل محل فعل <b>مبني للمعلوم</b>: a wire <s>which attached</s> → a wire <b>attaching</b> the phone to the wall.</li><li><b>Past participle (V3)</b> يحل محل فعل <b>مبني للمجهول</b>: the copy <s>which was made</s> → the copy <b>made</b> by carbon paper.</li><li>وتستخدم أيضاً لحدث في نفس الوقت أو بعده: His system transformed their lives, <b>enabling</b> them to read.</li></ul>`,
q:[
['The vacation ______ we planned for months was enjoyable.',['who','which','where','whose'],1,'شيء غير عاقل ← which (امتحان 2026).'],

['Technology is always changing, ______ I find exciting.',['that','what','which','who'],2,'تعليق على الجملة كلها ← which.'],

['I live in a house ______ in 1910. (= which was built)',['building','built','was built','to build'],1,'مجهول ← V3.'],

['Which sentence is correct?',['My father, that is a doctor, works hard.','My father, who is a doctor, works hard.','My father who is a doctor, works hard.','My father, whom is a doctor, works hard.'],1,'غير محددة: who بين فاصلتين.']]}

reading:{title:'Oliver Twist by Charles Dickens (summary)',summary:`<ul><li>في إنجلترا في القرن التاسع عشر، عاش أفقر الناس في <b>دور العمل (workhouses)</b> ليدبّروا معيشتهم بالكاد، متجمعين معاً ليتدفؤوا.</li>
<li>وصلت امرأة إلى دار عمل، وأنجبت طفلاً ثم ماتت. سمّته الممرضة <b>Oliver Twist</b>، وأُرسل إلى دار للأيتام حتى عمر 9 سنوات ثم إلى دار العمل. حزن لفراقه الأيتام لأنهم كانوا <b>يعتنون ببعضهم</b> ولديهم <b>شعور بالانتماء</b>.</li>
<li>في دار العمل كان الأولاد يعانون <b>سوء التغذية</b>؛ شجّعوا أوليفر على طلب المزيد من الطعام فغضب المديرون.</li>
<li>هرب إلى <b>لندن</b>، والتقى <b>Jack Dawkins</b> الذي عرّفه بالعجوز <b>Fagin</b> فأعطاه طعاماً وسريراً — ليكسب ثقته ويجعله يعمل لديه. اكتشف أوليفر أن الأولاد <b>لصوص</b>.</li>
<li>اتُّهم أوليفر بسرقة منديل، لكن <b>Mr Brownlow</b> برّأه وأخذه إلى بيته. ثم خطفته امرأة وأعادته إلى فاجن، وأُرسل مع <b>Mr Sikes</b> ليتسلّق نافذة بيت فأُطلق عليه النار ونجا.</li>
<li>تبيّن أن أمّ أوليفر كانت <b>غنية</b>، وأن أخاه <b>Monks</b> أراد أن يصبح أوليفر لصاً كي لا يرث المال (لا يرثه إلا إذا كان أميناً).</li>
<li>في النهاية يعطي Monks أوليفر ماله ويغادر البلاد، ويتبنّى <b>Mr Brownlow</b> أوليفر.</li></ul>`,
skill:'Identifying attitudes and feelings of characters',skillHtml:`<p>استنتج مشاعر الشخصيات ودوافعها من أفعالها (مثلاً: لماذا أعطى فاجن أوليفر الطعام؟ ليكسب ثقته). ابحث عن الصفات والأفعال التي تكشف الشخصية.</p>`,

listening:{title:'A radio programme about life events',html:`<p>يرى المتحدث أن الأحداث المؤلمة قد يكون لها أثر <b>إيجابي</b> على شخصيتنا، والعكس صحيح.</p><ul><li><b>Habib:</b> لم يكن يُتحدّى بما يكفي في المدرسة (wasn’t being challenged enough).</li><li><b>Lama:</b> مولود جديد يعاني المغص (colic).</li><li><b>Dalia:</b> انتقلت إلى ألمانيا، وأصعب شيء كان صعوبة التواصل مع الناس.</li><li><b>Jawad:</b> توقف المتنمرون عن مضايقته عندما دافع عنه تلميذ جديد.</li></ul>
<h4>Active Listening: Fact or opinion?</h4><ul><li><b>الرأي:</b> اعتقاد شخصي؛ يُشار إليه بـ feel, believe, think, If you ask me…, I have the impression that…, to my mind…</li><li><b>الحقيقة:</b> لها دليل موضوعي يمكن التحقق منه: The data shows…, The research indicates…</li></ul>`},

writing:{title:'An opinion essay — مقال الرأي',html:`<h4>المحتوى والتنظيم</h4><ol><li><b>المقدمة:</b> لخّص الموضوع بكلماتك، واذكر موقفك (الأطروحة thesis).</li><li><b>العرض:</b> فقرتان أو ثلاث، كل فقرة فكرة واحدة؛ يجب تناول الموضوعين المذكورين في السؤال + فكرة من عندك.</li><li><b>الخاتمة:</b> لخّص النقاط وأعد تأكيد رأيك.</li></ol>
<h4>Topic sentences جمل الموضوع</h4><p>كل فقرة تبدأ بجملة تحتوي الفكرة الرئيسية، وبقية الجمل تدعمها بتفاصيل وأسباب وأمثلة بترتيب منطقي.</p>
<h4>الأسلوب</h4><ul><li>أسلوب شبه رسمي.</li><li>للرأي الشخصي: Personally, … / In my opinion, … / My personal conviction is that … / I would argue that … / I believe that … / I would say that …</li><li>للآراء العامة: It is often argued that … / It is widely believed that … / Many people today feel that … / It is commonly accepted that …</li><li>روابط: Nevertheless, In addition, Therefore, Whereas, Overall, In conclusion</li></ul>`,
task:'People in your family are more influential in your life than your friends, or any other influence. Do you agree?',
model:`<h4 class="en">Who Influences Us Most?</h4><p class="en">It is often argued that friends, social media and celebrities shape young people more than their families do. While these influences are certainly important, I would argue that my family remains the strongest influence in my life.</p><p class="en">First of all, our families shape our values from the very beginning. My parents taught me honesty, respect and the importance of education long before I made any friends. These values guide the decisions I make every day, even when my parents are not with me.</p><p class="en">It is widely believed that teenagers listen to their friends more than to their parents. To some extent, this is true when it comes to fashion, music or hobbies. However, when I face a serious problem, such as choosing my subjects for the Tawjihi, it is my family whose advice I trust most.</p><p class="en">In addition, family members are often our first role models. My older brother, who studied engineering, set a good example by working hard, and I hope to follow in his footsteps. Friends may come and go, but family support lasts a lifetime.</p><p class="en">In conclusion, although friends and the media influence our interests, I believe that our families have the deepest and most lasting influence on who we become.</p>`},

grammar:[
{t:'Narrative tenses: Past Perfect Simple & Continuous',ar:'أزمنة السرد: الماضي التام البسيط والمستمر',html:`
<p>في سرد القصص: <b>Past Simple</b> للأحداث الرئيسية، <b>Past Continuous</b> للخلفية والأحداث المستمرة، و<b>Past Perfect</b> للخلفية والأحداث التي سبقت.</p>
<table class="gt"><tr><th>الزمن</th><th>التكوين</th><th>الاستخدام</th><th>مثال</th></tr>
<tr><td>Past Perfect Simple</td><td>had + V3</td><td>حدث اكتمل قبل حدث/وقت ماضٍ، مدة حالة قبل نقطة ماضية، تجارب قبل نقطة ماضية</td><td>By the time he died, he <b>had written</b> a lot of letters.</td></tr>
<tr><td>Past Perfect Continuous</td><td>had been + V-ing</td><td>مدة نشاط استمر حتى نقطة في الماضي، أو سبب لنتيجة ماضية</td><td>She was tired because she <b>had been flying</b> for hours.</td></tr></table>
<p><b>كلمات الربط:</b> when, after, because, as, before, by, by the time</p>
<div class="tip">⚠️ <b>لا</b> نستخدم Past Perfect Continuous مع عدد المرات: She had visited him <b>three times</b> ✔ / She had been visiting him <b>regularly</b> ✔ / She had been visiting him three times ✘</div>
<div class="tip">💡 Sami missed the wedding party because he <b>had been</b> in the hospital for two days. (امتحان 2026)</div>
<h4>النطق</h4><p>في الكلام السريع تُلفظ had و been بشكل ضعيف: /həd/ و /bɪn/.</p>`,
q:[
['Sami missed the wedding party because he ______ in the hospital for two days.',['would have been','would be','had been','was being'],2,'حالة سبقت حدثاً ماضياً ← Past Perfect (امتحان 2026).'],
['They lit some candles and then everyone ______ in a circle and told stories.',['sit','sits','sat','has sat'],2,'تسلسل أحداث رئيسية في الماضي ← Past Simple (امتحان 2026).'],
['She was tired because she ______ the news for hours.',['watched','had been watching','has watched','was watched'],1,'مدة + سبب لنتيجة ماضية.'],
['Before the EBAP visited the Black Desert, nobody ______ its archaeology.',['explored','had explored','has explored','was exploring'],1,'قبل حدث ماضٍ ← Past Perfect.'],
['Elvis ______ 24 studio albums before he died.',['had been recording','had recorded','recorded','was recording'],1,'عدد ← Past Perfect Simple.'],
['I ______ the website twice before I went to school.',['had checked','had been checking','have checked','was checking'],0,'twice ← Simple.'],
['The protesters ______ outside the mine for two hours when the reporters arrived.',['stood','had been standing','have stood','stand'],1,'مدة حتى نقطة ماضية.'],
['When the band ______ their second song, the lights went out.',['played','were playing','had played','have played'],1,'حدث مستمر قاطعه حدث قصير.'],
['They were delighted as they ______ the puzzle.',['just solved','had just solved','have just solved','were just solving'],1,'اكتمل قبل الحدث ← had just + V3.'],
['She had been visiting him ______.',['three times','twice','regularly','once'],2,'المستمر لا يُستخدم مع عدد المرات ← regularly.']]},
{t:'Negative inversion',ar:'القلب بعد أدوات النفي (التوكيد)',html:`
<p>نستخدمه لإضافة <b>توكيد</b> وتأثير درامي. عند بدء الجملة بظرف نفي يتقدّم <b>الفعل المساعد على الفاعل</b> كالسؤال:</p>
<p class="en big">Negative adverbial + auxiliary + subject + verb</p>
<p class="en">I had never felt so afraid. → <b>Never had I</b> felt so afraid.</p>
<table class="gt"><tr><th>العبارة</th><th>مثال</th></tr>
<tr><td>Never / At no time</td><td>Never have I heard such a weird story!</td></tr>
<tr><td>Seldom / Rarely</td><td>Rarely does he get so much attention.</td></tr>
<tr><td>Hardly / Barely / Scarcely … <b>when</b> …</td><td>Scarcely had I opened the paper <b>when</b> I saw the story.</td></tr>
<tr><td>No sooner … <b>than</b> …</td><td>No sooner had they huddled together <b>than</b> the wind blew a hole.</td></tr>
<tr><td>Under no circumstances / In no way</td><td>Under no circumstances should you leave the building.</td></tr>
<tr><td>Not only … but (also) …</td><td>Not only <b>did he run</b> a marathon, but he did it alone!</td></tr>
<tr><td>Little (did I know/imagine)</td><td>Little did they imagine how much was growing there.</td></tr></table>
<div class="tip">⚠️ في الزمن البسيط نضيف do/does/did والفعل يرجع للمصدر: Not only <b>did I feel</b> relaxed ✔ — Not only I felt ✘ — Not only felt I ✘ (امتحان 2026)</div>
<div class="tip">💡 Hardly/Scarcely يأتي معها <b>when</b>، و No sooner يأتي معها <b>than</b>.</div>`,
q:[
['The sentence which has the correct form of negative inversion is…',['Not only I felt relaxed, but also happy.','Not only did I feel relaxed, but also happy.','Not only felt I relaxed, but also happy.','Not only I did feel relaxed, but also happy.'],1,'Not only + did + subject + V1 (امتحان 2026).'],
['Never ______ such a heart-warming story.',['I have heard','have I heard','I heard','heard I'],1,'Never + have + I + V3.'],
['No sooner had she made the statement ______ she realised her mistake.',['when','than','that','then'],1,'No sooner … than.'],
['Scarcely had I opened the newspaper ______ I saw a sensational story.',['than','when','that','so'],1,'Scarcely … when.'],
['Under no circumstances ______ leave the building.',['you should','should you','you must','do you should'],1,'قلب: should you.'],
['Little ______ know what a lucky escape he had had.',['he did','did he','he had','had he'],1,'Little did he know.'],
['Rarely ______ so much attention.',['he gets','does he get','he does get','gets he'],1,'Rarely + does + he + V1.'],
['He didn’t realise the problems he’d caused. → Little ______ the problems he’d caused.',['he realised','did he realise','had he realised','he did realise'],1,'Little did he realise.'],
['I had only just left when the house exploded. → Hardly ______ when the house exploded.',['I had left','had I left','did I leave','I left'],1,'Hardly had I left … when.'],
['At no time ______ we were right.',['we claimed','did we claim','claimed we','we did claim'],1,'At no time + did + we + V1.']]}
],
reading:{title:'New hotel is just what the area needs / New hotel, but no new hope for locals',summary:`<p>تقريران صحفيان عن نفس الحدث (بناء فندق فاخر على الشاطئ المحلي) لكن بوجهتي نظر <b>متعارضتين</b>:</p>

<li><b>التقرير الثاني (معارض):</b> الكاتب غيّر رأيه بعد البحث: الشركة دولية توظّف <b>طاقماً دولياً</b> ومقاولين من خارج المنطقة، والمطاعم الجديدة الفاخرة <b>غالية</b> على السكان، وعمال المطاعم القديمة سيخسرون وظائفهم، والطرق الجديدة ستضر <b>بالحياة البرية</b> في منطقة طبيعية حساسة. ينفي أنه عرقل العمل، وسينضم للمحتجين المطالبين <b>بتعليق البناء</b>.</li></ul>`,
skill:'Recognising bias — اكتشاف التحيّز',skillHtml:`<p>قليل من النصوص متوازن تماماً. علامات التحيّز:</p><ul><li>حقائق ناقصة أو مبالغ فيها.</li><li>تعميمات مفرطة (everyone, all, 100%).</li><li>قلة احترام للآراء المخالفة.</li><li>علامات تنصيص تدل على عدم موافقة الكاتب (their ‘improvement’ scheme).</li></ul>

writing:{title:'A story — كتابة القصة',html:`<ul><li><b>العنوان:</b> جذاب ومثير.</li><li><b>البنية:</b> يمكن البدء من منتصف الحدث لتأثير درامي، ثم العودة للخلفية (The day had started so well…).</li><li><b>اللغة:</b> نوّع الأزمنة (Past Simple للأحداث، Past Continuous للخلفية، Past Perfect لما سبق)، واستخدم كلمات الترتيب (before, after, first, then, at that moment)، والكلام المباشر (‘Hey! Stop!’ he yelled)، والقلب للتوكيد (No sooner had…).</li><li>استخدم أفعالاً وصفية: yell, bellow, mutter / glance, peer, spot / race, wander.</li></ul>
<h4>ترتيب الظروف</h4><p>Manner (الكيفية) ← Place (المكان) ← Time (الزمان): <i>I drove <b>aimlessly</b> <b>around the city</b> <b>for hours</b>.</i></p>`,
task:'Write a story starting or ending with the sentence: Malak hadn’t imagined that her day would be a disaster.',
model:`<h4 class="en">The Wrong Bus</h4><p class="en">Malak hadn’t imagined that her day would be a disaster. She had been preparing for her university interview for weeks, and she had chosen her clothes carefully the night before.</p><p class="en">That morning, she woke up late because her phone had died during the night. She grabbed her bag and raced to the bus stop. No sooner had she sat down than she realised she was on the wrong bus! ‘Excuse me, does this go to the university?’ she asked the driver nervously. ‘No, love, it goes the opposite way,’ he muttered.</p><p class="en">Malak jumped off at the next stop and glanced at her watch. Only twenty minutes left! She waved desperately at a taxi, but it was full. Then, to top it all, it started to pour with rain.</p><p class="en">Soaking wet, she finally ran into the building, ten minutes late. The professor peered at her over his glasses. Malak’s heart was pounding. ‘I’m so sorry,’ she whispered. To her surprise, he smiled. ‘Don’t worry. Our last student hasn’t arrived yet either.’</p><p class="en">Never had Malak felt so relieved. The interview went brilliantly, and a month later she received her acceptance letter. It turned out that her disastrous day had a happy ending after all.</p>`},

grammar:[
{t:'Gerunds and infinitives',ar:'اسم الفعل (V-ing) والمصدر (to + V)',html:`
<h4>to + infinitive</h4><ul><li>للتعبير عن <b>الغاية</b>: You should eat them <b>to reduce</b> the risk.</li><li>بعد أفعال: agree, allow, appear, attempt, encourage, expect, fail, force, help, need, persuade, plan, promise, refuse, tend, happen, enable, want</li><li>بعد صفات: difficult, easy, important, likely, quick, helpful: It’s important <b>to remember</b>.</li><li>بعد first, second, last: I’d be the last <b>to help</b> him.</li></ul>
<h4>المصدر بدون to</h4><ul><li>بعد <b>let</b> و <b>make</b>: They may <b>make you feel</b> happier. / <b>Let</b> your heart <b>slow</b> down.</li><li>help + (to) V: They help your brain (to) grow.</li><li>بعد would rather / had better / modals.</li></ul>
<h4>Gerund (V-ing)</h4><ul><li><b>فاعل</b> للجملة: <b>Jogging</b> is good for you.</li><li>بعد أفعال: avoid, can’t stand, can’t help, consider, don’t mind, enjoy, fancy, feel like, imagine, involve, risk, suggest, have difficulty</li><li>بعد <b>حروف الجر</b>: the risk <b>of having</b> a heart attack / without <b>looking</b>.</li><li>بعد before, after, when, while: <b>Before going</b> out…</li></ul>
<h4>used to / be used to / get used to</h4><table class="gt"><tr><th>الصيغة</th><th>المعنى</th><th>مثال</th></tr><tr><td>used to + V1</td><td>عادة ماضية انتهت</td><td>I <b>used to wear</b> glasses.</td></tr><tr><td>be used to + V-ing</td><td>معتاد على (أمر طبيعي لي)</td><td>I’<b>m used to wearing</b> glasses.</td></tr><tr><td>get used to + V-ing</td><td>يعتاد تدريجياً</td><td>I’<b>m getting used to wearing</b> glasses.</td></tr></table>
<h4>بلا فرق في المعنى</h4><p>begin, start, continue, love, hate + to V أو V-ing.</p>
<p><b>prefer:</b> I prefer <b>staying</b> in to going out (عام) / I’d prefer <b>to stay</b> in tonight (موقف محدد).</p>`,

['She has difficulty ______ without her glasses.',['to read','reading','read','in read'],1,'have difficulty + V-ing.'],
['This enables us ______ without looking at the keyboard.',['type','typing','to type','typed'],2,'enable + object + to V.'],

{t:'Verbs with gerunds and infinitives (change in meaning)',ar:'أفعال يتغيّر معناها بين V-ing و to V',html:`
<table class="gt"><tr><th>الفعل</th><th>+ to V</th><th>+ V-ing</th></tr>
<tr><td>remember</td><td>يتذكر أن يفعل (ثم يفعل): <i>Remember to take your kit.</i></td><td>يتذكر أنه فعل: <i>I remember bringing my kit.</i></td></tr>
<tr><td>forget</td><td>ينسى أن يفعل: <i>Don’t forget to put the ice cream in the freezer.</i></td><td>ينسى ما فعله (غالباً منفي): <i>I’ll never forget tasting ice cream for the first time.</i></td></tr>
<tr><td>try</td><td>يحاول (يبذل جهداً): <i>I try to plan it.</i></td><td>يجرّب (كتجربة/نصيحة): <i>Try working in the library.</i></td></tr>
<tr><td>stop</td><td>يتوقف <b>لكي</b> يفعل شيئاً آخر: <i>I stopped to buy petrol.</i></td><td>يتوقف عن الفعل: <i>The car stopped making a noise.</i></td></tr>
<tr><td>regret</td><td>يأسف لإبلاغ (رسمي): <i>We regret to inform you…</i></td><td>يندم على ما فعل: <i>I regret not studying harder.</i></td></tr>
<tr><td>mean</td><td>يقصد/ينوي: <i>I didn’t mean to put so much chilli.</i></td><td>يعني/يتطلب: <i>Becoming a perfumer means giving up spicy food.</i></td></tr>
<tr><td>go on</td><td>ينتقل لفعل شيء جديد: <i>She went on to write books.</i></td><td>يستمر في الفعل نفسه: <i>He went on talking.</i></td></tr>
<tr><td>like</td><td>يفضّل فعله لأنه جيد/مناسب: <i>I like to see the dentist twice a year.</i></td><td>يستمتع به: <i>I like swimming.</i></td></tr></table>
<h4>أفعال الحواس + object</h4><ul><li>+ <b>V1</b> لحدث <b>مكتمل</b>: I saw him <b>score</b> the winning goal.</li><li>+ <b>V-ing</b> لحدث <b>مستمر</b>: I can hear my neighbour <b>practising</b> his violin.</li></ul>
<h4>need / deserve / require + V-ing (معنى المجهول)</h4><p>Do these grapes need <b>washing</b>? (= need to be washed) / These documents require <b>signing</b>.</p>
<h4>would rather / would sooner</h4><ul><li>I’d rather <b>eat</b> something light. (بدون to)</li><li>I’d rather you <b>didn’t tell</b> me what to order. (فاعل + ماضٍ)</li></ul>`,

reading:{title:'Sabriye Tenberken: An amazing woman',summary:`<ul><li>ألمانية فقدت بصرها في سن <b>12</b>. في مدرستها الأولى كان الأطفال <b>قساة</b> معها والمعلمون لا يفهمون احتياجاتها، وكانت <b>تخفي عماها</b>.</li>
<li>في مدرسة داخلية للمكفوفين أدركت أن المكفوفين <b>قادرون</b> على فعل ما يفعله الآخرون؛ تعلمت ركوب الخيل وقراءة <b>برايل</b> وتقبّلت عماها وزادت ثقتها.</li>
<li>درست <b>التبتية</b> في جامعة بون، وعرفت أن كثيراً من التبتيين يعانون مشاكل بصرية بسبب النظام الغذائي، لكن <b>أساساً بسبب الشمس الضارة في المرتفعات</b>. لم توجد برايل تبتية فابتكرت نظاماً.</li>
<li>في سن <b>26</b> سافرت إلى التبت على ظهر حصان مع تبتيين، وصدمت من معاملة الأطفال المكفوفين (بعضهم لا يُسمح له بالخروج لأن أهله يخافون أن يؤذي نفسه).</li>
<li>أسست مع شريكها <b>Paul Kronenberg</b> مدرسة <b>Braille Without Borders</b> لمساعدة الأطفال على التكيف مع العمى.</li>
<li>رُشّحت لـ <b>جائزة نوبل للسلام 2005</b> (لم تفز بها)، وألّفت كتاب <b>My Path Leads to Tibet</b>.</li></ul>`,
skill:'Making inferences — الاستنتاج',skillHtml:`<p>أحياناً لا يذكر الكاتب المعلومة مباشرة؛ نستنتجها من <b>القرائن في النص</b> ومعرفتنا وخبرتنا.</p><ul><li>"She often tried to hide her blindness" ← نستنتج أنها كانت تشعر بالخجل (True).</li><li>"Together they set up a school" ← لم تؤسسها وحدها (False).</li><li>"She was nominated for the Nobel Peace Prize" ← رُشّحت فقط، لم تفز (False).</li></ul>`,

listening:{title:'A podcast about the history of ketchup',html:`<ul><li>صُنع الكاتشب لأول مرة في <b>الصين</b> في القرن السادس (من صلصة سمك).</li><li>وصفات الكاتشب البريطانية الأولى احتوت على السمك والفطر والجوز، لكن <b>بدون طماطم</b>.</li><li>في القرنين 17 و18 ظنّ الأوروبيون أن الطماطم <b>سامة</b>.</li><li>زجاجة الكاتشب البلاستيكية القابلة للضغط اختُرعت عام <b>1983</b>.</li><li>كاتشب الفلبين مصنوع من <b>الموز</b> لكن لا طعم له مثل الموز.</li><li>الشباب يفضلون المكونات الطازجة مثل <b>الجلاية بندورة</b>.</li></ul>
<h4>مفردات الوصفة</h4><p>Slice the tomatoes in half (no need to peel them). Place in a large pan, stir in vinegar, sugar, salt and pepper. Bring to the boil, then simmer for 20 mins. Whizz in a food processor until you have a smooth puree. Chill before serving.</p>`},

writing:{title:'A review — المراجعة',html:`<ol><li><b>المقدمة:</b> تفاصيل مختصرة: أين ومتى ذهبت، وانطباعك العام.</li><li><b>الفقرة 1:</b> وصف المكان/الحدث بالتفصيل (ما تراه وتسمعه…).</li><li><b>الفقرة 2 (الإيجابيات):</b> What I really liked was … / One highlight was … / I was also impressed / blown away by …</li><li><b>الفقرة 3 (السلبيات):</b> My only criticism is … / If I have one criticism, it’s … / It didn’t live up to my expectations. / I was disappointed by …</li><li><b>الخاتمة (التوصية):</b> I’d definitely recommend going … / It’s (not) worth visiting …</li></ol>
<h4>الأسلوب</h4><ul><li>أسلوب غير رسمي حيوي: lots of, mind-blowing, gross، أفعال مركبة (check out)، مشاعر شخصية، علامات تعجب!</li></ul>
<h4>المُكثِّفات (Intensifiers)</h4><table class="gt"><tr><th>مع الصفات المتدرجة (gradable)</th><th>مع الصفات غير المتدرجة (non-gradable)</th><th>مع كليهما</th></tr><tr><td>very, extremely, super, hugely, highly, incredibly + loud, scared, interesting, silly</td><td>absolutely, completely, totally, utterly + deafening, petrified, fascinating, ridiculous, mind-blowing</td><td>pretty, really, seriously</td></tr></table>`,
task:'Write a review of a café, a computer game, a music album, a restaurant or an exhibition.',
model:`<h4 class="en">Review: Rainbow Street Café, Amman</h4><p class="en">Last Friday, my cousins and I decided to check out a new café on Rainbow Street, and I’m so glad we did – it was a hugely enjoyable evening!</p><p class="en">The café is in an old stone house with a beautiful rooftop terrace overlooking the city. As soon as you walk in, the delicious aroma of fresh coffee and baking bread hits you. Soft music plays in the background, and the walls are covered in colourful paintings by local artists.</p><p class="en">What I really liked was the menu. There is a huge choice of hot and cold drinks, and the desserts are absolutely mouth-watering. One highlight was the warm kunafa, which was seriously the best I have ever tasted. I was also impressed by the friendly staff, who were incredibly helpful.</p><p class="en">My only criticism is that it gets extremely crowded in the evenings, so we had to wait twenty minutes for a table. The prices are also a little high for students.</p><p class="en">Despite that, I’d definitely recommend going there if you’re in Amman. Not only is the food fantastic, but the view at sunset is totally mind-blowing!</p>`},

texts:`<h4 class="en">Moving Mountains</h4><p class="en">As a teenager, the sight of Mount Kilimanjaro rising majestically above the Serengeti made Vern Jones desperately want to climb <u>it</u>. Finally in 2014, at the age of 62, Vern finally realised his dream while accompanied by his daughters and their husbands. However, he was all too aware that he couldn’t have succeeded without the help of the guides. These young men, who are often ill-equipped themselves and poorly paid, work daily in dangerous conditions to help climbers achieve their goals. Vern’s response was to found Kili Summit Club which raises money to help the guides from the proceeds of mountain gear sales. They receive footwear and equipment to help them with their work, as well as commission from sales, allowing climbers to support them long after their adventure is over.</p>
<h4 class="en">The Milk of Human Kindness</h4><p class="en">In 2015, Tracy Warshal was in the queue at a busy shop during the holiday season when the man in front of her realised he’d forgotten his wallet. Tracy paid for the stranger’s milk and other items and, after thanking her and asking her name, he was on his way. She thought no more of it until a month later when she was contacted by colleagues at the cancer charity where she worked. They told her that the man, who wished to remain anonymous, wanted to donate $10,000 to the foundation in her name. As she was wearing a T-shirt with the charity’s name on it at the shop, he was able to track her down. She told reporters, ‘I’m just so excited that one small gesture made a huge difference and impact on a lot of people.’</p>`,

q3:[
['Nowadays, many people carefully select their profile pictures, edit their posts and try to present a perfect image online. Write an essay providing arguments for and against this practice.',`<p class="en"><b>Presenting a Perfect Image Online</b></p><p class="en">Nowadays, social media plays a huge role in our lives, and many people spend a lot of time choosing the perfect profile picture and editing their posts. While some people believe this is harmless, others think it can be damaging.</p><p class="en">On the one hand, there are some advantages. Presenting yourself well online can help you make a good first impression, especially when applying for jobs or universities. Moreover, sharing achievements can motivate others and make people feel proud of their hard work.</p><p class="en">On the other hand, this practice has serious disadvantages. Firstly, it creates an unrealistic picture of life, which can make other people feel jealous or unhappy with their own lives. Secondly, people who constantly edit their image may lose their self-confidence and feel pressure to look perfect all the time. Finally, it wastes time that could be spent with family and friends.</p><p class="en">In conclusion, although presenting a positive image online has some benefits, I believe it is more important to be honest and natural. We should remember that nobody’s life is perfect.</p>`],

function unitTestQs(u,n){
  const words=[];u.vocab.forEach(s=>s.w.forEach(w=>words.push({e:w[0],a:w[1],x:w[2]})));
  let pool=[];u.grammar.forEach(g=>pool=pool.concat(g.q));pool=pool.concat(u.extra,u.reading.q.slice(0,3));

// ---------- QUIZ ENGINE ----------
function quiz(title,qs,key,opt){
  opt=opt||{};let i=0,score=0,wrong=[],answered=false,left=opt.time||0;
  setHeader(title,qs.length+' سؤالاً',document.documentElement.style.getPropertyValue('--uc')||'#2563eb');
  function render(){
    const q=qs[i];answered=false;
    const isAr=q[4]===1;
    app.innerHTML=(opt.ctx?`<details class="card"><summary><b>📄 اضغط لعرض النص</b></summary>${opt.ctx}</details>`:'')+`<div class="card"><div class="qhead"><span>سؤال ${i+1} من ${qs.length}</span>${opt.time?'<span class="timer" id="tm"></span>':''}<span>✔ ${score}</span></div><div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
    <div class="qtext">${esc(q[0])}</div><div id="ops">${q[1].map((o,k)=>`<button class="opt" data-k="${k}" ${isAr?'style="direction:rtl;text-align:right"':''}><b>${'ABCD'[k]}</b>${esc(o)}</button>`).join('')}</div><div id="ex"></div></div>`+(opt.time?'':'<div style="text-align:center"><button class="btn o s" id="quit">إنهاء الاختبار</button></div>');
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    const qb=$('#quit');if(qb)qb.onclick=finish;
    tick();
  }
  function tick(){const t=$('#tm');if(t)t.textContent='⏱ '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}
  if(opt.time){clearInterval(timerId);timerId=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timerId);toast('انتهى الوقت!');finish()}},1000)}
  function pick(k){
    if(answered)return;answered=true;const q=qs[i],ok=k===q[2];
    const bs=app.querySelectorAll('.opt');bs[q[2]].classList.add('ok');if(!ok){bs[k].classList.add('no');wrong.push([q,k])}else score++;
    if(opt.exam){next();return}
    $('#ex').innerHTML=`<div class="expl">${ok?'✅ إجابة صحيحة!':'❌ الإجابة الصحيحة: <b class="en" style="display:inline">'+esc(q[1][q[2]])+'</b>'}${q[3]?'<br>'+esc(q[3]):''}</div><button class="btn" id="nx">${i<qs.length-1?'التالي ←':'عرض النتيجة'}</button>`;
    $('#nx').onclick=next;$('#nx').scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function next(){i++;if(i<qs.length)render();else finish()}
  function finish(){
    clearInterval(timerId);const done=Math.max(i+(answered&&i<qs.length?1:0),1);const total=opt.time||opt.exam?qs.length:Math.min(done,qs.length);
    const pct=Math.round(score/total*100);
    if(key){S.best[key]=Math.max(S.best[key]||0,pct);save()}
    const msg=pct>=90?'ممتاز! أداء رائع 🌟':pct>=75?'جيد جداً 👏':pct>=50?'جيد، تحتاج مراجعة بسيطة 💪':'راجع الدرس وحاول مرة أخرى 📖';
    app.innerHTML=`<div class="card score"><div style="font-size:50px">${pct>=75?'🏆':pct>=50?'👍':'📚'}</div><div class="big2">${pct}%</div><p>${score} من ${total} — ${msg}</p><div class="row" style="justify-content:center"><button class="btn" id="again">🔁 إعادة</button><button class="btn o" id="bk">رجوع</button></div></div>`+
    (wrong.length?`<div class="card"><h4 style="margin-top:0">مراجعة الأخطاء (${wrong.length})</h4>${wrong.map(([q,k])=>`<div class="q2"><div class="en"><b>${esc(q[0])}</b></div><div class="en" style="color:var(--no)">✘ ${esc(q[1][k])}</div><div class="en" style="color:var(--ok)">✔ ${esc(q[1][q[2]])}</div>${q[3]?`<div class="small">${esc(q[3])}</div>`:''}</div>`).join('')}</div>`:'');
    $('#again').onclick=()=>{qs=opt.fixed?qs:shuffle(qs);i=0;score=0;wrong=[];left=opt.time||0;if(opt.time){timerId=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timerId);finish()}},1000)}render()};
    $('#bk').onclick=back;
  }
  render();
}

function flash(title,words){

    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn s g" id="kn">✔ أعرفها</button><button class="btn s" style="background:var(--wa)" id="hd">⭐ صعبة</button></div></div>`;
    $('#fc').onclick=()=>$('#fc').classList.toggle('f');
    $('#sp').onclick=()=>speak(w.e);
    $('#nx').onclick=()=>{i=(i+1)%list.length;r()};$('#pv').onclick=()=>{i=(i-1+list.length)%list.length;r()};
    $('#kn').onclick=()=>{const k=S.hard.indexOf(w.e);if(k>=0){S.hard.splice(k,1);save()}i=(i+1)%list.length;r()};
    $('#hd').onclick=()=>{if(!S.hard.includes(w.e)){S.hard.push(w.e);S.hardData=S.hardData||{};S.hardData[w.e]=[w.a,w.x||''];save()}toast('أُضيفت إلى كلماتي الصعبة ⭐');i=(i+1)%list.length;r()};
  }r();
}

  (act?'':`<div class="card"><h4 style="margin-top:0">خطوات التفعيل</h4><ol><li>اضغط زر واتساب لإرسال اسمك ورقم جهازك.</li><li>ستصلك <b>كود التفعيل</b> بعد إتمام الاشتراك.</li><li>اكتب الكود هنا واضغط «تفعيل».</li></ol>
  <a class="fbtn" style="background:#25d366;display:flex;justify-content:center" href="${WA}?text=${msg}" target="_blank" rel="noopener">💬 اطلب كود التفعيل عبر واتساب</a><p class="small" style="text-align:center">واتساب: 00962779221235</p>
  <input class="search en" id="code" placeholder="– –" maxlength="2" inputmode="numeric" pattern="[0-9]*" style="text-align:center;letter-spacing:8px;font-size:26px;font-weight:bold"><br><br><button class="btn g" id="actb" style="width:100%;justify-content:center">🔑 تفعيل</button></div>`)+
  (locked?'':footer());
  $('#cp').onclick=()=>{try{navigator.clipboard.writeText(id).then(()=>toast('تم نسخ رقم الجهاز'),()=>toast(id))}catch(e){toast(id)}};
  $('#ed').onclick=()=>{const t=$('#ed').parentNode;t.innerHTML=`<input class="search" id="nn" value="${esc(S.name)}" maxlength="40"><button class="btn s g" id="sv" style="margin-top:6px">حفظ</button>`;$('#sv').onclick=()=>{const v=$('#nn').value.trim();if(v.length>1){S.name=v;save();toast('تم حفظ الاسم')}activatePage(locked)}};
  const ab=$('#actb');if(ab)ab.onclick=()=>{
    const wait=(S.failUntil||0)-Date.now();
    if(wait>0){toast('⛔ محاولات خاطئة كثيرة. حاول بعد '+Math.ceil(wait/3600000)+' ساعة');return}
    const c=$('#code').value.replace(/[^0-9]/g,'');if(c.length!==2){toast('اكتب كود التفعيل المكوّن من رقمين');return}
    if(c===codeFor(id)){S.act=c;S.fails=0;save();toast('🎉 تم تفعيل التطبيق بنجاح!');stack=[];go(home)}
    else{S.fails=(S.fails||0)+1;if(S.fails%3===0){S.failUntil=Date.now()+24*3600000;toast('⛔ 3 محاولات خاطئة — تم إيقاف التفعيل 24 ساعة')}else toast('❌ الكود غير صحيح، متبقٍ '+(3-S.fails%3)+' محاولة');save()}};
}
// ---------- BOOK (PDF reader) ----------
const BOOK_URL='https://nccd.gov.jo/Ar/Pages/textbooks';
const BOOK_PAGES={1:5,2:17,3:31,4:43,5:57};
const BOOK_JUMPS=[['الغلاف والمحتويات',1],['Unit 1',5],['Unit 2',17],['Life Skills 1',29],['Unit 3',31],['Unit 4',43],['Life Skills 2',55],['Unit 5',57],['Culture Spot',69],['Literature Spot',71],['Word List',73],['Grammar Reference',78],['Irregular Verbs',91],['Use of English',92]];
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('eng11db',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbPut(k,v){try{const db=await idb();await new Promise(r=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}}
function loadPdfJs(){return new Promise((res,rej)=>{if(window.pdfjsLib)return res(window.pdfjsLib);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{let t=0;const w=()=>{if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc=window.PDFJS_WORKER||'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(pdfjsLib)}else if(t++<50)setTimeout(w,100);else rej()};w()};s.onerror=()=>rej();document.head.appendChild(s)})}
let PDF=null;
async function bookPage(start){
  setHeader('كتاب الطالب','Student’s Book — Grade 11, Semester 1','#1d4ed8');
  if(window.Android&&Android.openBook){try{Android.openBook(start||1);back();return}catch(e){}}
  app.innerHTML='<div class="card" style="text-align:center">⏳ جارٍ التحميل…</div>';
  const blob=PDF?null:await idbGet('book');
  if(!PDF&&!blob)return bookPick(start);
  try{const lib=await loadPdfJs();if(!PDF){PDF=await lib.getDocument({data:await blob.arrayBuffer()}).promise}}
  catch(e){app.innerHTML='<div class="card">تعذّر تشغيل قارئ الكتاب. تأكد من اتصالك بالإنترنت عند فتحه أول مرة ثم حاول مجدداً.</div>';return}
  bookView(start||S.bookPage||1);
}
function bookPick(start){
  app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:52px">📘</div><h3 style="margin:6px 0">كتاب الطالب — من مصدره الرسمي</h3><p>كتاب <b>English — Grade 11, Semester 1</b> متاح مجاناً للطلبة على الموقع الرسمي <b>للمركز الوطني لتطوير المناهج والتقويم</b>.</p>
  <a class="fbtn" style="background:#1d4ed8;display:flex;justify-content:center;font-size:16px;padding:12px" href="${BOOK_URL}" target="_blank" rel="noopener">🌐 افتح الكتاب من الموقع الرسمي</a>
  <p class="small en" style="text-align:center">nccd.gov.jo</p></div>
  <div class="card"><h4 style="margin-top:0">طريقة الوصول للكتاب</h4><ol><li>اضغط الزر في الأعلى ليفتح موقع المركز الوطني لتطوير المناهج.</li><li>ستظهر صفحة <b>الكتب المدرسية</b> مباشرة.</li><li>اختر <b>الصف الحادي عشر</b> ← <b>اللغة الإنجليزية</b> ← <b>كتاب الطالب — الفصل الأول</b>.</li></ol>
  <p class="small">أرقام الصفحات المهمة في الكتاب: الوحدة 1 ص4 · الوحدة 2 ص16 · الوحدة 3 ص30 · الوحدة 4 ص42 · الوحدة 5 ص56 · Word List ص72 · Grammar Reference ص77</p></div>
  <details class="card"><summary><b>📂 هل لديك ملف الكتاب على جهازك؟ افتحه داخل التطبيق</b></summary><p class="small">إذا كانت لديك نسخة الكتاب من مدرستك، اخترها مرة واحدة ليفتحها التطبيق مباشرة على صفحة كل وحدة.</p><label class="btn o" style="cursor:pointer">اختر ملف الكتاب<input type="file" id="pf" accept="application/pdf,.pdf" style="display:none"></label></details>`+footer();
  $('#pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!/pdf$/i.test(f.name)&&f.type!=='application/pdf'){toast('اختر ملف PDF');return}
    app.innerHTML='<div class="card" style="text-align:center">⏳ جارٍ حفظ الكتاب…</div>';await idbPut('book',f);PDF=null;bookPage(start)};
}
function bookView(p){
  const n=PDF.numPages;let page=Math.min(Math.max(1,p),n),zoom=1,busy=false;
  app.innerHTML=`<div class="card" style="padding:10px"><div class="row" style="justify-content:space-between">
  <select id="jp" class="search" style="width:auto;padding:8px">${BOOK_JUMPS.map(j=>`<option value="${j[1]}">${j[0]}</option>`).join('')}</select>
  <div class="row"><button class="ib" id="zo">−</button><button class="ib" id="zi">+</button><button class="ib" id="chg" title="تغيير الملف">📂</button></div></div></div>
  <div class="card" style="padding:6px;overflow:auto;text-align:center" id="cv"><canvas id="pc" style="max-width:none"></canvas></div>
  <div class="card row" style="justify-content:center;position:sticky;bottom:8px;padding:10px"><button class="btn o" id="pv">→</button><span><input id="pn" class="search en" style="width:70px;padding:6px;text-align:center;display:inline" value="${page}"> / ${n}</span><button class="btn" id="nx">←</button></div>`;
  async function render(){if(busy)return;busy=true;S.bookPage=page;save();$('#pn').value=page;
    const pg=await PDF.getPage(page),box=$('#cv'),w=box.clientWidth-12,vp0=pg.getViewport({scale:1}),sc=w/vp0.width*zoom,dpr=window.devicePixelRatio||1,vp=pg.getViewport({scale:sc*dpr}),c=$('#pc');
    c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/dpr)+'px';c.style.height=(vp.height/dpr)+'px';
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;busy=false;window.scrollTo(0,0)}
  $('#nx').onclick=()=>{if(page<n){page++;render()}};$('#pv').onclick=()=>{if(page>1){page--;render()}};
  $('#pn').onchange=()=>{const v=parseInt($('#pn').value)||1;page=Math.min(Math.max(1,v),n);render()};
  $('#jp').onchange=()=>{page=+$('#jp').value;render()};
  $('#zi').onclick=()=>{zoom=Math.min(3,zoom+.25);render()};$('#zo').onclick=()=>{zoom=Math.max(.5,zoom-.25);render()};
  $('#chg').onclick=()=>{PDF=null;bookPick(page)};
  let sx=null;$('#cv').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  $('#cv').addEventListener('touchend',e=>{if(sx===null||zoom>1)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60){if(dx>0&&page<n)page++;else if(dx<0&&page>1)page--;render()}sx=null});
  render();
}
// ---------- start ----------
go(home);
})();
